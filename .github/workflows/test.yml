name: test

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repo; keep the default token scoped down.
permissions:
  contents: read

# Every action (and the plenary clone below) is pinned to a commit SHA so a
# moved tag can't swap in different code under us.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check formatting with stylua
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned like everything else here: `latest` would run whatever the
          # newest release binary happens to be. Keep in step with the locally
          # installed stylua so `make lint` and CI agree.
          version: v2.5.2
          args: --check lua/ plugin/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        nvim: ["stable", "nightly"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Install plenary.nvim
        # Pinned: plenary's Lua executes in this job, so don't run whatever
        # its HEAD happens to be.
        run: |
          dir=~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/nvim-lua/plenary.nvim 74b06c6c75e4eeb3108ec01852001636d85a932b
          git -C "$dir" checkout -q FETCH_HEAD

      - name: Run tests
        run: make test
